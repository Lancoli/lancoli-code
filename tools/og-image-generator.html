<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Graph Image Generator - Lancoli Code</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #10140f;
            color: #e8f0e3;
        }
        canvas {
            border: 2px solid #5fb98a;
            border-radius: 6px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 2rem auto;
        }
        button {
            background: #5fb98a;
            color: #10140f;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            margin: 1rem auto;
        }
        button:hover {
            opacity: 0.9;
        }
        .info {
            text-align: center;
            opacity: 0.8;
            margin-top: 2rem;
        }
        .success {
            color: #5fb98a;
            text-align: center;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>Open Graph Image Generator</h1>
    <p>This page generates the Open Graph image for Lancoli Code (1200×630px).</p>

    <canvas id="canvas" width="1200" height="630"></canvas>

    <button id="download">Download og-image.png</button>

    <div class="info">
        <p>After downloading, place the file in:</p>
        <code>LancoliCode/assets/og-image.png</code>
    </div>

    <div id="success" class="success" style="display: none;">
        ✓ Image generated successfully!
    </div>

    <script>
        // Configuration
        const WIDTH = 1200;
        const HEIGHT = 630;
        const BG = '#10140f';
        const ACCENT = '#5fb98a';
        const TEXT = '#e8f0e3';
        const RADIUS = 6;

        // Generate image on load
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = BG;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Brand in top-left
            ctx.fillStyle = TEXT;
            ctx.font = 'bold 48px sans-serif';
            ctx.fillText('Lancoli', 60, 100);

            ctx.fillStyle = ACCENT;
            ctx.font = '48px monospace';
            ctx.fillText('/code', 230, 100);

            // Main title
            ctx.fillStyle = TEXT;
            ctx.font = 'bold 72px sans-serif';
            ctx.fillText('Journal de bord', 60, 220);

            // Subtitle
            ctx.fillStyle = TEXT;
            ctx.font = '36px sans-serif';
            ctx.globalAlpha = 0.8;
            ctx.fillText('Projets · UX · Design · Développement', 60, 290);
            ctx.globalAlpha = 1;

            // Visual elements representing the devlog
            const lineY = 380;
            const lineSpacing = 70;

            for (let i = 0; i < 3; i++) {
                const y = lineY + i * lineSpacing;

                // Rounded rectangle for each line
                ctx.fillStyle = ACCENT;
                ctx.globalAlpha = 0.15 + i * 0.1;
                roundRect(ctx, 60, y, 1080, 50, RADIUS);
                ctx.fill();

                // Accent bullet
                ctx.globalAlpha = 0.9 - i * 0.15;
                ctx.fillStyle = ACCENT;
                ctx.beginPath();
                ctx.arc(90, y + 25, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.globalAlpha = 1;

            // Show success message
            document.getElementById('success').style.display = 'block';
        });

        // Draws a rectangle with rounded corners
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // Download
        document.getElementById('download').addEventListener('click', () => {
            const canvas = document.getElementById('canvas');
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'og-image.png';
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        });
    </script>
</body>
</html>
