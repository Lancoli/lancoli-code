# generated by tools/kit-github.mjs
# Lints commits and PR title, with the same rule as local hook (scripts/commit-msg.mjs).
name: quality
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: { contents: read, pull-requests: read }
jobs:
  commits:
    # Bot PRs (Dependabot, release-please) follow their own format: don't block them
    if: "!endsWith(github.event.pull_request.user.login, '[bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: PR title
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: node .github/scripts/commit-msg.mjs --text "$TITLE"
      - name: Commit messages
        run: |
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" > /tmp/msg && node .github/scripts/commit-msg.mjs /tmp/msg || exit 1
          done
