# generated by tools/kit-github.mjs
# Automatic release PR: when pushing to main, release-please maintains a "chore: release" PR
# (version, CHANGELOG.md from feat/fix). Merging that PR creates the tag and GitHub release.
# Disabled by default; enable to avoid push failures (and emails):
#   1. Settings → Actions → General → tick "Allow GitHub Actions to create and approve pull requests"
#   2. Settings → Secrets and variables → Actions → Variables: RELEASE_PLEASE = on
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  release-please:
    if: vars.RELEASE_PLEASE == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with: { release-type: simple }
